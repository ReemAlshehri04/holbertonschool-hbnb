<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EcoStay - Login to Nature</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="logo-container">
        <div class="logo-icon"></div>
        <div class="logo-text">EcoStay <span>Nature & Travel</span></div>
    </div>
    <nav>
        <a href="index.html"> Home</a>
        <a href="login.html"> Login</a>
    </nav>
</header>

<main>
    <section class="form-container">
        <div class="nature-icon"></div>
        <h2>Welcome to EcoStay</h2>
        <div class="subtitle">Your gateway to eco-friendly accommodations</div>
        
        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" class="form">
            <div class="input-group">
                <label> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="details-button">🌿 Login to EcoStay</button>
        </form>

        <!-- عرض رسائل الخطأ أو النجاح -->
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <!-- رابط لصفحة التسجيل -->
        <div class="register-link">
             Don't have an account? <a href="register.html">Create one here</a>
        </div>
    </section>
</main>

<footer>
    <p> EcoStay - Sustainable Travel Experiences | © 2026</p>
</footer>

<script>
    // تكوين الـ API
    const API_BASE_URL = '/api/v1';
    
    // التحقق إذا كان المستخدم مسجل دخول مسبقًا
    const token = localStorage.getItem('access_token');
    if (token) {
        window.location.href = 'index.html';
    }
    
    // التعامل مع نموذج تسجيل الدخول
    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        // إخفاء الرسائل السابقة
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        // جلب البيانات من النموذج
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        // التحقق من صحة البيانات
        if (!email || !password) {
            errorDiv.textContent = '🌿 Please enter both email and password';
            errorDiv.style.display = 'block';
            return;
        }
        
        // تعطيل زر التسجيل أثناء المعالجة
        const submitButton = document.querySelector('#login-form button');
        const originalButtonText = submitButton.textContent;
        submitButton.textContent = '🔄 Logging in...';
        submitButton.disabled = true;
        
        try {
            // إرسال طلب تسجيل الدخول إلى الـ API
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // تسجيل الدخول ناجح - حفظ التوكنات
                localStorage.setItem('access_token', data.access_token);
                if (data.refresh_token) {
                    localStorage.setItem('refresh_token', data.refresh_token);
                }
                
                // حفظ معلومات المستخدم إذا وجدت
                if (data.user) {
                    localStorage.setItem('user_info', JSON.stringify(data.user));
                }
                
                // عرض رسالة نجاح
                successDiv.textContent = '✅ Login successful! Redirecting to nature... 🌿';
                successDiv.style.display = 'block';
                
                // توجيه المستخدم إلى الصفحة الرئيسية بعد 1.5 ثانية
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                // عرض رسالة الخطأ
                errorDiv.textContent = data.error || data.msg || '❌ Login failed. Please check your credentials.';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Login error:', error);
            errorDiv.textContent = ' Network error. Please make sure the server is running.';
            errorDiv.style.display = 'block';
        } finally {
            // إعادة تمكين زر التسجيل
            submitButton.textContent = originalButtonText;
            submitButton.disabled = false;
        }
    });
    
    // إضافة خاصية الضغط على Enter لتسجيل الدخول
    document.getElementById('login-form').addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            document.querySelector('#login-form button').click();
        }
    });
</script>

</body>
</html>
