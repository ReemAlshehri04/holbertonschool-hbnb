<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EcoStay - Place Details</title>
    <link rel="stylesheet" href="place.css">
</head>
<body>

<header>
    <div class="logo-container">
        <div class="logo-icon">🌿</div>
        <div class="logo-text">EcoStay <span>Nature & Travel</span></div>
    </div>
    <nav>
        <a href="index.html">🏠 Home</a>
        <span id="user-welcome" class="user-welcome"></span>
        <div id="logout-btn" class="logout-btn" style="display: none;">🚪 Logout</div>
        <a href="login.html" id="login-link" class="login-button" style="display: none;">🌿 Login</a>
    </nav>
</header>

<main>
    <!-- تفاصيل المكان -->
    <section id="place-details" class="place-details">
        <div class="loading-message">🌿 Loading place details...</div>
    </section>

    <!-- قائمة التقييمات -->
    <section id="reviews-section">
        <h3>📖 Traveler Reviews</h3>
        <div id="reviews-list">
            <div class="loading-message">🌿 Loading reviews...</div>
        </div>
    </section>

    <!-- نموذج إضافة تقييم -->
    <section id="add-review-section" style="display: none;">
        <h3>✍️ Share Your Experience</h3>
        <form id="review-form">
            <div class="form-group">
                <label>⭐ Rating</label>
                <select id="rating" required>
                    <option value="5">⭐⭐⭐⭐⭐ - Excellent (5 stars)</option>
                    <option value="4">⭐⭐⭐⭐ - Very Good (4 stars)</option>
                    <option value="3">⭐⭐⭐ - Good (3 stars)</option>
                    <option value="2">⭐⭐ - Fair (2 stars)</option>
                    <option value="1">⭐ - Poor (1 star)</option>
                </select>
            </div>
            <div class="form-group">
                <label>📝 Your Review</label>
                <textarea id="comment" rows="4" placeholder="Share your experience at this eco-friendly place..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">🌿 Submit Review</button>
            <div id="review-success" class="success-message"></div>
            <div id="review-error" class="error-message"></div>
        </form>
    </section>
</main>

<footer>
    <p>🌍 EcoStay - Sustainable Travel Experiences | © 2026</p>
</footer>

<script>
    const API_BASE_URL = '/api/v1';
    let placeId = null;
    
    // التحقق من المصادقة
    const token = localStorage.getItem('access_token');
    const loginLink = document.getElementById('login-link');
    const logoutBtn = document.getElementById('logout-btn');
    const userWelcome = document.getElementById('user-welcome');
    
    function updateAuthUI() {
        const token = localStorage.getItem('access_token');
        if (token) {
            loginLink.style.display = 'none';
            logoutBtn.style.display = 'block';
            const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');
            if (userInfo.first_name) {
                userWelcome.innerHTML = `👤 Welcome, ${userInfo.first_name}!`;
            }
        } else {
            loginLink.style.display = 'block';
            logoutBtn.style.display = 'none';
            userWelcome.innerHTML = '';
        }
    }
    
    // التحقق من وجود place ID
    placeId = localStorage.getItem('selected_place_id');
    if (!placeId) {
        window.location.href = 'index.html';
    }
    
    // التحقق من المصادقة للصفحة
    if (!token) {
        window.location.href = 'login.html';
    }
    
    updateAuthUI();
    
    // جلب تفاصيل المكان
    async function loadPlaceDetails() {
        const container = document.getElementById('place-details');
        
        try {
            const response = await fetch(`${API_BASE_URL}/places/${placeId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.status === 401) {
                window.location.href = 'login.html';
                return;
            }
            
            if (!response.ok) {
                throw new Error('Place not found');
            }
            
            const place = await response.json();
            
            // عرض تفاصيل المكان
            container.innerHTML = `
                <div class="place-hero">🏕️</div>
                <div class="place-info">
                    <h2>${place.name}</h2>
                    <div class="place-location">📍 ${place.location}</div>
                    <div class="place-description">${place.description || 'Experience nature at its finest at this beautiful eco-friendly destination. Perfect for nature lovers and sustainable travelers.'}</div>
                    <div class="place-stats">
                        <div class="stat">🌿 Eco-Certified</div>
                        <div class="stat">⭐ Top Rated</div>
                        <div class="stat">🏔️ Nature View</div>
                    </div>
                </div>
            `;
            
            // إظهار نموذج إضافة التقييم
            document.getElementById('add-review-section').style.display = 'block';
            
        } catch (error) {
            container.innerHTML = `
                <div class="place-info">
                    <h2>❌ Place Not Found</h2>
                    <p>Sorry, we couldn't find this place.</p>
                    <a href="index.html" style="color: #4caf50;">← Back to Places</a>
                </div>
            `;
        }
    }
    
    // جلب التقييمات
    async function loadReviews() {
        const container = document.getElementById('reviews-list');
        
        try {
            const response = await fetch(`${API_BASE_URL}/places/${placeId}/reviews`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const reviews = await response.json();
                
                if (reviews.length === 0) {
                    container.innerHTML = '<div class="no-reviews">🌿 No reviews yet. Be the first to share your experience!</div>';
                } else {
                    container.innerHTML = reviews.map(review => `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="review-rating">${'⭐'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</div>
                                <div class="review-date">📅 ${new Date(review.created_at).toLocaleDateString()}</div>
                            </div>
                            <div class="review-comment">${review.comment}</div>
                        </div>
                    `).join('');
                }
            } else {
                container.innerHTML = '<div class="no-reviews">🌿 Unable to load reviews</div>';
            }
        } catch (error) {
            container.innerHTML = '<div class="no-reviews">🌿 Error loading reviews</div>';
        }
    }
    
    // إضافة تقييم جديد
    document.getElementById('review-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const rating = document.getElementById('rating').value;
        const comment = document.getElementById('comment').value;
        const successDiv = document.getElementById('review-success');
        const errorDiv = document.getElementById('review-error');
        const submitBtn = document.querySelector('#review-form .submit-btn');
        
        successDiv.style.display = 'none';
        errorDiv.style.display = 'none';
        
        if (!comment.trim()) {
            errorDiv.textContent = '❌ Please write a review before submitting';
            errorDiv.style.display = 'block';
            return;
        }
        
        submitBtn.disabled = true;
        submitBtn.textContent = '🔄 Submitting...';
        
        try {
            const response = await fetch(`${API_BASE_URL}/places/${placeId}/reviews`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    rating: parseInt(rating),
                    comment: comment.trim()
                })
            });
            
            if (response.ok) {
                successDiv.textContent = '✅ Review submitted successfully! 🌿';
                successDiv.style.display = 'block';
                document.getElementById('review-form').reset();
                document.getElementById('rating').value = '5';
                loadReviews(); // إعادة تحميل التقييمات
                
                setTimeout(() => {
                    successDiv.style.display = 'none';
                }, 3000);
            } else {
                const error = await response.json();
                errorDiv.textContent = error.error || '❌ Failed to submit review';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = '🌿 Network error. Please try again.';
            errorDiv.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '🌿 Submit Review';
        }
    });
    
    // تسجيل الخروج
    function logout() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('user_info');
        localStorage.removeItem('selected_place_id');
        window.location.href = 'login.html';
    }
    
    document.getElementById('logout-btn').addEventListener('click', logout);
    
    // تحميل البيانات
    loadPlaceDetails();
    loadReviews();
</script>

</body>
</html>
