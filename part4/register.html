<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EcoStay - Create Account</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<header>
    <div class="logo-container">
        <div class="logo-icon"></div>
        <div class="logo-text">EcoStay <span>Nature & Travel</span></div>
    </div>
    <nav>
        <a href="index.html"> Home</a>
        <a href="login.html"> Login</a>
    </nav>
</header>

<main>
    <section class="form-container">
        <div class="nature-icon"></div>
        <h2>Join EcoStay Community</h2>
        <div class="subtitle">Start your sustainable travel journey today</div>
        
        <form id="register-form" class="form">
            <div class="input-group">
                <label> First Name</label>
                <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" required>
            </div>
            
            <div class="input-group">
                <label> Last Name</label>
                <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" required>
            </div>
            
            <div class="input-group">
                <label> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>
            
            <div class="input-group">
                <label> Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="details-button"> Create Eco Account</button>
        </form>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <div class="login-link">
             Already have an account? <a href="login.html">Login here</a>
        </div>
    </section>
</main>

<footer>
    <p> EcoStay - Sustainable Travel Experiences | © 2026</p>
</footer>

<script>
    const API_BASE_URL = '/api/v1';
    
    // التحقق من تسجيل الدخول المسبق
    if (localStorage.getItem('access_token')) {
        window.location.href = 'index.html';
    }
    
    document.getElementById('register-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        const first_name = document.getElementById('first_name').value.trim();
        const last_name = document.getElementById('last_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;
        
        // التحقق من صحة البيانات
        if (!first_name || !last_name || !email || !password) {
            errorDiv.textContent = ' Please fill in all fields';
            errorDiv.style.display = 'block';
            return;
        }
        
        if (password.length < 6) {
            errorDiv.textContent = ' Password must be at least 6 characters long';
            errorDiv.style.display = 'block';
            return;
        }
        
        if (password !== confirm_password) {
            errorDiv.textContent = ' Passwords do not match';
            errorDiv.style.display = 'block';
            return;
        }
        
        if (!email.includes('@') || !email.includes('.')) {
            errorDiv.textContent = ' Please enter a valid email address';
            errorDiv.style.display = 'block';
            return;
        }
        
        const submitButton = document.querySelector('#register-form button');
        const originalText = submitButton.textContent;
        submitButton.textContent = ' Creating account...';
        submitButton.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE_URL}/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    first_name: first_name,
                    last_name: last_name,
                    email: email,
                    password: password
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                successDiv.textContent = ' Account created successfully! Redirecting to login... 🌿';
                successDiv.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                errorDiv.textContent = data.error || data.message || ' Registration failed. Please try again.';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Registration error:', error);
            errorDiv.textContent = ' Network error. Please make sure the server is running.';
            errorDiv.style.display = 'block';
        } finally {
            submitButton.textContent = originalText;
            submitButton.disabled = false;
        }
    });
</script>

</body>
</html>
